# Gera o FalidoDaLuta.zip (Windows) a partir do código deste repositório.
# - Em todo push na main e manualmente (aba Actions > Gerar jogo > Run workflow): o .zip fica
#   disponível como "artifact" da execução.
# - Ao criar uma tag de versão (ex.: v1.0.0): o .zip também é publicado em Releases.
name: Gerar jogo

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Luta
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt pyinstaller pillow

      - name: Gerar o .exe
        run: python tools/gerar_jogo.py

      - name: Guardar o .zip
        uses: actions/upload-artifact@v4
        with:
          name: FalidoDaLuta
          path: Luta/dist/FalidoDaLuta.zip

      - name: Publicar em Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Luta/dist/FalidoDaLuta.zip
